version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "02:00"
      timezone: UTC
    commit-message:
      prefix: "chore"
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "02:00"
      timezone: UTC
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
