name: Audit

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - .github/workflows/audit.yml
  pull_request:
    branches: [main]
    paths:
      - Cargo.lock
      - .github/workflows/audit.yml
  schedule:
    - cron: "0 2 * * 5"  # every Friday at 02:00 UTC
  workflow_dispatch:

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # audit-check reports a check run on push/PR
      issues: write # audit-check (on schedule) and the step below open issues
    steps:
      - uses: actions/checkout@v7
      # Pinned to main: the Node 24 runtime update (#48) isn't in a tagged release yet (v2.0.0 is still node20).
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main, 2026-03-20
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Open issue on failure
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --search "Security audit failed" --state open --json number --jq length)
          if [ "$existing" -eq 0 ]; then
            gh issue create \
              --title "Security audit failed ($(date -u +%Y-%m-%d))" \
              --body "cargo audit failed on \`${{ github.event_name }}\` — [view run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi
